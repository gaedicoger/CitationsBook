<!doctype html>
<html lang="fr">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Mes citations</h1>
    <h2>Gestionnaire de citations en ligne</h2>
    <h3 id="count">0 citations</h3>
    <hr />
    <form id="citation-form">
      <label for="citation">Citations</label
      ><input
        type="text"
        id="citation"
        name="citation"
        placeholder="Entrez votre citation ici"
      />
      <label for="citation">Auteurice</label>
      <input type="text" id="author" name="author" placeholder="Auteurice" />
      <input type="submit" value="Envoyer" />
    </form>
    <hr />
    <div id="quote-list">
      <div class="quote">
        <p class="citationText">"On ne naît pas femme, on le devient."</p>
        <p class="authorText">Simone de Beauvoir</p>
      </div>
    </div>
  </body>
  <script src="script.js" defer></script>
</html>
